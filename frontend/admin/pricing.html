<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Pricing — Admin | SpicesMart</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5A623">
  <script src="/js/pwa.js"></script>
</head>
<body>
<div class="layout" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">🌶️</div><span>SpicesMart</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebar-user-avatar">A</div>
        <div class="user-details">
          <div class="user-name" id="sidebar-user-name">…</div>
          <div class="user-role" id="sidebar-user-role">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-full mt-4" onclick="logout()">↩ Sign Out</button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger-btn">☰</button>
      <span class="topbar-title">Pricing Matrix</span>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="save-pricing-btn" onclick="savePricing()">💾 Save All Prices</button>
      </div>
    </header>

    <main class="page-body">
      <div class="card-dark" style="margin-bottom:16px">
        <p style="font-size:0.85rem;color:var(--text-secondary)">
          ⚙️ Edit prices directly in the table cells. Click <strong>Save All Prices</strong> to apply changes across all products.
        </p>
      </div>
      <div class="table-container pricing-table">
        <div class="table-header"><span class="table-title">Product Price Tiers</span></div>
        <div id="pricing-table-body"><div class="spinner"></div></div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/admin.js"></script>
<script>initAdminPricing();</script>
</body>
</html>
