<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Analytics — Admin | SpicesMart</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .analytics-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .chart-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; color: var(--text-muted); }
    .chart-container { position: relative; height: 300px; width: 100%; }
    .stats-row { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    @media(max-width: 900px) { .analytics-grid { grid-template-columns: 1fr; } }
  </style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5A623">
  <script src="/js/pwa.js"></script>
</head>
<body>
<div class="layout" id="app" style="opacity:0;transition:opacity 0.2s">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon">🌶️</div><span>SpicesMart</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebar-user-avatar">A</div>
        <div class="user-details">
          <div class="user-name" id="sidebar-user-name">…</div>
          <div class="user-role" id="sidebar-user-role">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-full mt-4" onclick="logout()">↩ Sign Out</button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="hamburger" id="hamburger-btn">☰</button>
      <span class="topbar-title">Business Analytics</span>
    </header>

    <main class="page-body">
      
      <div class="stats-row" id="analytics-stats">
        <!-- Rendered by JS -->
      </div>

      <div class="analytics-grid">
        <!-- Revenue Line Chart -->
        <div class="chart-card">
          <div class="chart-title">Revenue (Last 30 Days)</div>
          <div class="chart-container"><canvas id="revenueChart"></canvas></div>
        </div>
        
        <!-- Top Products Doughnut Chart -->
        <div class="chart-card">
          <div class="chart-title">Top Selling Products</div>
          <div class="chart-container" style="height:250px"><canvas id="productsChart"></canvas></div>
        </div>
      </div>
      
      <div class="analytics-grid" style="grid-template-columns: 1fr 2fr">
        <!-- Sales by Role Pie Chart -->
        <div class="chart-card">
          <div class="chart-title">Sales by Role</div>
          <div class="chart-container" style="height:250px"><canvas id="rolesChart"></canvas></div>
        </div>
        <div class="chart-card" style="display:flex;align-items:center;justify-content:center">
          <p class="text-muted text-center">SpicesMart Analytics Engine<br/>Powered by Chart.js</p>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Global Loader -->
<div class="global-loader" id="page-loader"><div class="spinner" style="width:40px;height:40px"></div></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/analytics.js"></script>
<script>initAnalytics();</script>
</body>
</html>
